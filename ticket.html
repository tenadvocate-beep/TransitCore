<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TransitCore Ticket</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef3fb;
    padding:40px;
}

.ticket{

    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.header{

    background:#0B63CE;
    color:white;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;

}

.header img{
    width:140px;
}

.header h1{

    font-size:30px;

}

.content{

    padding:40px;

}

.grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;

}

.box{

    background:#f7f9fc;
    padding:20px;
    border-radius:12px;

}

.box h4{

    color:#0B63CE;
    margin-bottom:8px;

}

.value{

    font-size:18px;
    font-weight:bold;

}

.qr{

    text-align:center;
    margin-top:40px;

}

.qr img{

    width:180px;

}

.buttons{

    display:flex;
    justify-content:center;
    gap:20px;
    margin:40px;

}

button{

    padding:14px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-size:16px;

}

.print{

    background:#0B63CE;

}

.download{

    background:#28a745;

}

@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

.header{

flex-direction:column;
gap:20px;

}

}

</style>

</head>

<body>

<div class="ticket">

<div class="header">

<div>

<img src="images/logo.jpg" id="logo">

</div>

<div>

<h1>TRANSITCORE</h1>

<p>Official Bus Ticket</p>

</div>

</div>

<div class="content">

<div class="grid">

<div class="box">
<h4>Passenger</h4>
<div class="value" id="passenger"></div>
</div>

<div class="box">
<h4>Email</h4>
<div class="value" id="email"></div>
</div>

<div class="box">
<h4>Route</h4>
<div class="value" id="route"></div>
</div>

<div class="box">
<h4>Seat</h4>
<div class="value" id="seat"></div>
</div>

<div class="box">
<h4>Departure</h4>
<div class="value" id="departure"></div>
</div>

<div class="box">
<h4>Arrival</h4>
<div class="value" id="arrival"></div>
</div>

<div class="box">
<h4>Booking Code</h4>
<div class="value" id="code"></div>
</div>

<div class="box">
<h4>Status</h4>
<div class="value" style="color:green;">
Confirmed
</div>
</div>

</div>

<div class="qr">

<img id="qr">

<p>Scan to verify this ticket</p>

</div>

</div>

<div class="buttons">

<button class="print" onclick="window.print()">
🖨 Print Ticket
</button>

<button class="download" id="downloadBtn">
📥 Download PDF
</button>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const bookingId =
new URLSearchParams(window.location.search)
.get("booking");

async function loadTicket(){

const response = await fetch(
`https://transitcore-ylgu.onrender.com/api/bookings/${bookingId}`
);

console.log(response.status);

const data = await response.json();
console.log("Full API response:", data);
const booking = data.booking;
console.log(data);
console.log(booking);
console.log(booking.user);
console.log(booking.route);

document.getElementById("passenger").textContent =
booking.passengerName;

document.getElementById("email").textContent =
booking.user ? booking.user.email : "Not Available";

document.getElementById("route").textContent =
booking.route.origin+" → "+booking.route.destination;

document.getElementById("seat").textContent =
booking.seatNumber;

document.getElementById("departure").textContent =
booking.route.departureTime;

document.getElementById("arrival").textContent =
booking.route.arrivalTime;

document.getElementById("code").textContent =
booking.bookingCode;

console.log(booking);
console.log(booking.bookingCode);

document.getElementById("qr").src =
"https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+booking.bookingCode;

}

loadTicket();

const { jsPDF } = window.jspdf;

document.getElementById("downloadBtn").addEventListener("click", async () => {

    const ticket = document.querySelector(".ticket");

    const canvas = await html2canvas(ticket, {
        scale: 2
    });

    const imgData = canvas.toDataURL("image/png");

    const pdf = new jsPDF("p", "mm", "a4");

    const pdfWidth = 190;

    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

    pdf.addImage(
        imgData,
        "PNG",
        10,
        10,
        pdfWidth,
        pdfHeight
    );

    pdf.save("TransitCore-Ticket.pdf");

});

</script>

</body>
</html>
