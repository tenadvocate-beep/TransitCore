<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | TransitCore</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#F5F7FB;
}

nav{
background:#0B1B42;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

nav h2{
font-size:24px;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:600;
}

.container{
width:90%;
max-width:1100px;
margin:50px auto;
}

.title{
margin-bottom:30px;
}

.title h1{
color:#0B1B42;
}

.booking-card{

background:white;
padding:25px;
margin-bottom:20px;
border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.booking-card h2{

color:#2B54E8;
margin-bottom:15px;

}

.booking-card p{

margin:8px 0;

}

.cancel-btn{

margin-top:20px;
background:#D64545;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;

}

.cancel-btn:hover{

opacity:.9;

}

</style>

</head>
<script>

const token = localStorage.getItem("token");

if (!token) {
    alert("Please log in first.");
    window.location.href = "login.html";
}

async function loadBookings() {

    try {

        const res = await fetch(
            "http://https://transitcore-ylgu.onrender.com/api/bookings/my-bookings",
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await res.json();

        const bookingList = document.getElementById("bookingList");

        bookingList.innerHTML = "";

        if (!data.success || data.bookings.length === 0) {

            bookingList.innerHTML =
                "<p>You haven't booked any trips yet.</p>";

            return;
        }

        data.bookings.forEach(booking => {

            bookingList.innerHTML += `
                <div class="booking-card">

                    <h2>${booking.bookingCode}</h2>

                    <p><strong>Route:</strong>
                    ${booking.route.origin} → ${booking.route.destination}</p>

                    <p><strong>Seat:</strong>
                    ${booking.seatNumber}</p>

                    <p><strong>Status:</strong>
                    ${booking.bookingStatus}</p>

                    <p><strong>Payment:</strong>
                    ${booking.paymentStatus}</p>

                    <button
                        class="cancel-btn"
                        onclick="cancelBooking('${booking._id}')">
                        Cancel Booking
                    </button>

                </div>
            `;

        });

    } catch (err) {

        console.error(err);

        document.getElementById("bookingList").innerHTML =
            "<p>Unable to load bookings.</p>";

    }

}

loadBookings();
async function cancelBooking(id) {

    const confirmCancel = confirm(
        "Are you sure you want to cancel this booking?"
    );

    if (!confirmCancel) return;

    try {

        const res = await fetch(
            `http://https://transitcore-ylgu.onrender.com/api/bookings/${id}/cancel`,
            {
                method: "PUT",
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await res.json();

        alert(data.message);

        loadBookings();

    } catch (err) {

        console.error(err);

        alert("Unable to cancel booking.");

    }

}

</script>
